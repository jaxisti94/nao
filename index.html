<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAO · ბათუმი</title>
<meta name="description" content="NAO — 33-სართულიანი ზღვისპირა რეზიდენცია ბათუმში. ბინები, ფასები და ხედები რეალურ 3D ქალაქში.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Widgets/widgets.css">
<style>

/* Layout: full-bleed 3D scene, glass control panels floating over it like a sales-gallery kiosk. Single dark look by choice; bronze accent taken from the tower's facade fins. */
:root{
  --ink:#0b1216; --panel:rgba(12,20,25,.86); --panel-solid:#111b21; --line:rgba(190,215,225,.14);
  --fg:#e9eff1; --muted:#90a4ac; --sand:#cf9a6a; --sand-ink:#1d1006;
  --st-a:#3fb4d8; --st-r:#e6b545; --st-s:#d9544f; --st-b:#a083e0; --st-c:#7b8892;
  --display:"Marcellus","Noto Serif Georgian",Georgia,serif;
  --serif:"Noto Serif Georgian",Georgia,serif;
  --sans:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:14px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{padding:10px 16px}
.brand b{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.22em;display:block;line-height:1}
.brand span{font-size:12px;color:var(--muted)}
.live{display:inline-block;margin-top:6px;font-size:10.5px;padding:2px 8px;border-radius:99px;background:rgba(207,154,106,.15);color:var(--sand);white-space:nowrap}
#timebox{justify-self:center;width:min(460px,100%);padding:10px 16px 8px}
#timebox .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#clock{font-family:var(--serif);font-size:15px}
#time{width:100%;accent-color:var(--sand);margin:6px 0 2px}
.stops{display:flex;justify-content:space-between}
.stops button{background:none;border:0;padding:2px 0;font-size:11.5px;color:var(--muted)}
.stops button.on{color:var(--sand)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:10px;padding:9px 13px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:rgba(207,154,106,.55)}
.btn.on{background:var(--sand);color:var(--sand-ink);border-color:var(--sand)}
.btn.primary{background:var(--sand);color:var(--sand-ink);border-color:var(--sand);font-weight:600}

#filters{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 112px);width:300px;
  max-height:calc(100% - 200px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;z-index:4}
.grp{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:rgba(207,154,106,.16);border-color:var(--sand);color:var(--fg)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.range{display:flex;align-items:center;gap:8px}
.range input{flex:1;min-width:0;accent-color:var(--sand)}
.range output{min-width:74px;text-align:right;font-size:12.5px}
#count{font-family:var(--serif);font-size:15px}
#list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
#list button{display:grid;grid-template-columns:12px 44px 1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;font-size:12.5px}
#list button:hover{background:rgba(255,255,255,.04)}
#list .p{color:var(--muted)}

#legend{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:10px 14px;display:flex;gap:14px;z-index:4;font-size:12.5px;flex-wrap:wrap;max-width:calc(100% - 32px)}
#legend span{display:inline-flex;align-items:center;gap:7px}
#compass{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 64px);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;z-index:4;font-size:10px}
#compass b{position:absolute;bottom:5px;font-weight:600;color:var(--muted)}
#needle{color:var(--sand);font-size:16px;transform-origin:50% 60%;display:block;margin-top:-6px}
#osm{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 2px);font-size:10px;color:var(--muted);z-index:3;text-shadow:0 1px 2px #000}
#hint{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:12px;color:var(--muted);z-index:3;text-shadow:0 1px 3px #000;max-width:46%;text-align:right}

#card{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 112px);width:370px;
  max-height:calc(100% - 180px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:18px;z-index:6;display:flex;flex-direction:column;gap:14px}
.card-h,#card>*{flex:none}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-h h2{margin:0;font-family:var(--serif);font-weight:600;font-size:22px}
.x{background:none;border:1px solid var(--line);border-radius:50%;width:30px;height:30px;line-height:1;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden}
.stats div{background:var(--panel-solid);padding:9px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font-size:15px;font-weight:600}
.price{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--sand)}
.plan{background:#fff;border-radius:10px;overflow:hidden;position:relative}
.plan svg{display:block;width:100%;height:auto}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .btn{text-align:center}
.calc{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.kv b{font-weight:600}

#tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;z-index:7;max-width:calc(100% - 32px);flex-wrap:wrap}
#modal{position:fixed;inset:0;background:rgba(4,8,10,.6);display:grid;place-items:center;z-index:20;padding:16px}
#modal>.panel>*{flex:none}
#modal>.panel{background:var(--panel-solid);padding:20px;width:min(760px,100%);max-height:90%;overflow:auto}
#modal table{width:100%;border-collapse:collapse;font-size:13.5px}
#modal th,#modal td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
#modal th{color:var(--muted);font-weight:500}
#modal td.best{color:var(--sand);font-weight:600}
#modal .bigplan{background:#fff;border-radius:10px;overflow:hidden;margin-top:12px}

#viewbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding:10px;display:flex;gap:8px;align-items:center;z-index:8;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px)}
#viewbar .t{padding:0 8px;font-size:13px;color:var(--muted)}
#viewnote{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 120px);padding:8px 14px;font-size:12.5px;color:var(--muted);z-index:8;max-width:calc(100% - 32px);text-align:center}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s;z-index:15}
#tip{position:fixed;pointer-events:none;z-index:9;padding:5px 9px;font-size:12px;border-radius:8px;background:var(--panel-solid);border:1px solid var(--line);white-space:nowrap}
#mfilters{display:none}
body.viewing #filters,body.viewing #legend,body.viewing #tray,body.viewing #card,body.viewing #hint,body.viewing #statusBtn,body.viewing #resetBtn,body.viewing #mfilters{display:none!important}

@media (max-width:860px){
  #top{grid-template-columns:minmax(0,1fr) auto}
  .live{display:none}
  .actions{gap:6px}
  .actions .btn{padding:7px 10px;font-size:12px}
  #timebox{grid-column:1/-1;grid-row:2;width:100%}
  .brand b{font-size:18px;letter-spacing:.12em}
  .brand>span:not(.live),.brand br{display:none}
  .brand{padding:8px 12px}
  #filters{display:none;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:auto;right:max(16px,env(safe-area-inset-right,0px));max-height:62%;z-index:10}
  body.show-filters #filters{display:flex}
  #mfilters{display:inline-block}
  #card{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:max(16px,env(safe-area-inset-left,0px));width:auto;max-height:64%;z-index:11}
  #legend{bottom:calc(env(safe-area-inset-bottom,0px) + 64px);gap:10px;font-size:11.5px;padding:8px 10px}
  #hint{display:none}
  #compass{bottom:calc(env(safe-area-inset-bottom,0px) + 118px)}
  .stats{grid-template-columns:repeat(2,1fr)}
  #viewnote{top:calc(env(safe-area-inset-top,0px) + 190px)}
}
@media (prefers-reduced-motion:reduce){#fade{transition:none}}

#cesium{position:fixed;inset:0}
#cesium .cesium-viewer-bottom{left:auto;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 4px)}
#cesium .cesium-widget-credits{font-size:10px}
#three{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:2;touch-action:none}
body.viewing #three{display:block}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 20px;z-index:20;font-size:14px}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
</style>
</head>
<body>
<div id="cesium"></div>
<canvas id="three" aria-label="ხედი აივნიდან"></canvas>
<div id="fade"></div>
<div id="tip" hidden></div>
<div id="loading" class="panel">ბათუმის 3D რუკა იტვირთება…</div>

<header id="top">
  <div class="brand panel">
    <b>NAO</b>
    <span>ზღვისპირა რეზიდენცია · ბათუმი, ანგისის I შესახვევი 12ა</span><br>
    <span class="live">ფასები და სტატუსები: 03.11.2026</span>
  </div>
  <div></div>
  <div class="actions">
    <button class="btn" id="mfilters">ფილტრები</button>
    <button class="btn on" id="statusBtn" aria-pressed="true">სტატუსები</button>
    <button class="btn" id="resetBtn">ხედის აღდგენა</button>
  </div>
</header>

<aside id="filters" class="panel" aria-label="ფილტრები">
  <div class="grp"><span class="lbl">სტატუსი</span><div class="chips" id="fStatus"></div></div>
  <div class="grp"><span class="lbl">ფართი</span>
    <div class="chips" id="fArea">
      <button class="chip on" data-v="all">ყველა</button><button class="chip" data-v="0-40">40 მ²-მდე</button><button class="chip" data-v="40-60">40–60</button><button class="chip" data-v="60-80">60–80</button><button class="chip" data-v="80-999">80+</button>
    </div></div>
  <div class="grp"><span class="lbl">ხედი</span>
    <div class="chips" id="fView">
      <button class="chip on" data-v="all">ყველა</button><button class="chip" data-v="s">ზღვის ხედი</button><button class="chip" data-v="m">მთის ხედი</button>
    </div></div>
  <div class="grp"><span class="lbl">სართული (მინ.)</span>
    <div class="range"><input id="fFmin" type="range" min="6" max="33" value="6" aria-label="მინიმალური სართული"><output id="oFmin" class="num">6</output></div></div>
  <div class="grp"><span class="lbl">მაქს. ფასი</span>
    <div class="range"><input id="fPmax" type="range" min="0" max="1" step="1000" aria-label="მაქსიმალური ფასი"><output id="oPmax" class="num"></output></div></div>
  <div class="grp"><span id="count"></span><div id="list"></div></div>
</aside>

<div id="legend" class="panel"></div>
<div id="hint">გადაათრიეთ — გადაადგილება · Ctrl + გადათრევა ან ორი თითი — მოტრიალება · ბორბალი — მიახლოება · დააჭირეთ ბინას</div>

<aside id="card" class="panel" hidden aria-live="polite"></aside>
<div id="tray" class="panel" hidden></div>
<div id="viewbar" class="panel" hidden>
  <span class="t" id="viewTitle"></span>
  <button class="btn on" id="v1">ხედი 1</button>
  <button class="btn" id="v2">ხედი 2</button>
  <button class="btn" id="vReal" hidden>3D ქალაქი</button>
  <button class="btn primary" id="vBack">უკან შენობაზე</button>
</div>
<div id="viewnote" class="panel" hidden></div>
<div id="modal" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Cesium.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

const view={yaw:0,pitch:-.12,gyaw:0,gpitch:-.12,c:0,h:Math.PI,x:0,y:0,z:0};
const clampYaw=y=>Math.max(view.c-view.h,Math.min(view.c+view.h,y));
function dirYaw(a,i){const ds=DIR[a.k];let [dx,dz]=ds[Math.min(i,ds.length-1)];const [wx,wz]=rot(dx,dz);let y=Math.atan2(wx,wz);if(i===1&&ds.length===1)y+=.6;return y;}
let mode='orbit',viewApt=null;
function setReal(on){real=on&&!!PANOS[viewApt.floor];if(real)loadPano(viewApt.floor);showPanoParts();
  $('#vReal').textContent=real?'3D ქალაქი':'დრონის ხედი';
  $('#viewnote').textContent=real?`დრონით გადაღებული ${viewApt.floor}-ე სართულის სიმაღლიდან, მაისი 2026`:`3D ქალაქი (Google) · ~${Math.round(view.y)} მ სიმაღლე`;}
$('#vReal').onclick=()=>setReal(!real);
function fadeSwap(fn){const f=$('#fade');f.style.opacity=1;setTimeout(()=>{fn();f.style.opacity=0;},300);}
function enterView(a){fadeSwap(()=>{mode='view';viewApt=a;document.body.classList.add('viewing');$('#viewbar').hidden=false;$('#viewnote').hidden=false;$('#tip').hidden=true;$('#modal').hidden=true;
  const [dx,dz]=DIR[a.k][0];[view.x,view.z]=rot(a.cx+dx*(a.hw+1.8),a.cz+dz*(a.hd+1.8));view.y=a.y0+EYE;
  const ds=DIR[a.k],y1=dirYaw(a,0),HALF=62*Math.PI/180;
  if(ds.length>1){let y2=Math.atan2(...rot(...ds[1]));y2=y1+wrapA(y2-y1);view.c=(y1+y2)/2;view.h=Math.abs(y2-y1)/2+HALF;}else{view.c=y1;view.h=HALF;}
  balc.rotation.y=view.c;view.yaw=view.gyaw=y1;view.pitch=view.gpitch=-.12;pcam.fov=62;pcam.updateProjectionMatrix();
  $('#vReal').hidden=!PANOS[a.floor];setReal(true);
  $('#viewTitle').textContent=`№ ${a.id} · ${a.floor} სართული`;setV(0);
  tileset&&(tileset.maximumScreenSpaceError=8);});}
function setV(i){view.gyaw=clampYaw(view.c+wrapA(dirYaw(viewApt,i)-view.c));view.yaw=view.c+wrapA(view.yaw-view.c);view.gpitch=-.12;$('#v1').classList.toggle('on',i===0);$('#v2').classList.toggle('on',i===1);}
$('#v1').onclick=()=>setV(0);$('#v2').onclick=()=>setV(1);
function exitView(){fadeSwap(()=>{mode='orbit';real=false;showPanoParts();document.body.classList.remove('viewing');$('#viewbar').hidden=true;$('#viewnote').hidden=true;
  viewer.camera.frustum.fov=Cesium.Math.toRadians(60);tileset&&(tileset.maximumScreenSpaceError=16);if(viewApt)focusApt(viewApt);});}
$('#vBack').onclick=exitView;
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#modal').hidden)$('#modal').hidden=true;else if(mode==='view')exitView();else deselect();});
// drag / zoom on the balcony
const pts=new Map();let pinch0=0;const dist2=()=>{const p=[...pts.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};
tcan.addEventListener('pointerdown',e=>{tcan.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2)pinch0=dist2();});
tcan.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){const k=pcam.fov/innerHeight*Math.PI/180;view.gyaw=clampYaw(view.gyaw+dx*k);view.gpitch=Math.max(-.6,Math.min(.35,view.gpitch+dy*k));}
  else{const d=dist2();pcam.fov=Math.max(25,Math.min(PFOV,pcam.fov*pinch0/d));pcam.updateProjectionMatrix();pinch0=d;}});
const up=e=>pts.delete(e.pointerId);tcan.addEventListener('pointerup',up);tcan.addEventListener('pointercancel',up);
tcan.addEventListener('wheel',e=>{e.preventDefault();pcam.fov=Math.max(25,Math.min(PFOV,pcam.fov*(1+e.deltaY*.0008)));pcam.updateProjectionMatrix();},{passive:false});
function resize(){renderer.setSize(innerWidth,innerHeight,false);pcam.aspect=innerWidth/innerHeight;pcam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
function syncCesium(){ // put the Cesium camera on the balcony looking the same way as the overlay
  const dirW=[Math.sin(view.yaw),Math.cos(view.yaw)];const bearing=Math.atan2(dirW[0],-dirW[1]);
  viewer.camera.setView({destination:P(view.x,view.y,view.z),orientation:{heading:bearing,pitch:view.pitch,roll:0}});
  const fr=viewer.camera.frustum,a=innerWidth/innerHeight,v=pcam.fov*Math.PI/180;fr.fov=a>1?2*Math.atan(Math.tan(v/2)*a):v;}
function frame(){if(mode==='view'){view.yaw+=(view.gyaw-view.yaw)*.12;view.pitch+=(view.gpitch-view.pitch)*.12;
    pcam.position.set(0,EYE,0);pcam.lookAt(Math.sin(view.yaw)*Math.cos(view.pitch),EYE+Math.sin(view.pitch),Math.cos(view.yaw)*Math.cos(view.pitch));
    if(!real)syncCesium();renderer.render(tscene,pcam);}
  requestAnimationFrame(frame);}
frame();

/* ---------- filters / legend ---------- */
$('#fStatus').innerHTML=Object.entries(STATUS).map(([k,s])=>`<button class="chip on" data-v="${k}"><i class="dot" style="background:${s.c}"></i>${s.ka}</button>`).join('');
const cnt=k=>apts.filter(a=>a.status===k).length;
$('#legend').innerHTML=Object.entries(STATUS).map(([k,s])=>`<span><i class="dot" style="background:${s.c}"></i>${s.ka} <b class="num">${cnt(k)}</b></span>`).join('');
const prices=apts.filter(a=>a.status!=='s'&&a.price>0).map(a=>a.price);
const pr=$('#fPmax');pr.min=Math.floor(Math.min(...prices)/1000)*1000;pr.max=Math.ceil(Math.max(...prices)/1000)*1000;pr.value=pr.max;
function chipGroup(id,key,multi){$(id).querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  if(multi){F[key].has(b.dataset.v)?F[key].delete(b.dataset.v):F[key].add(b.dataset.v);b.classList.toggle('on');}
  else{F[key]=b.dataset.v;$(id).querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));}applyFilters();});}
chipGroup('#fStatus','status',true);chipGroup('#fArea','area');chipGroup('#fView','view');
$('#fFmin').oninput=e=>{F.fmin=+e.target.value;applyFilters();};
pr.oninput=e=>{F.pmax=+e.target.value>=+pr.max?Infinity:+e.target.value;applyFilters();};
function applyFilters(){$('#oFmin').textContent=F.fmin;$('#oPmax').textContent=F.pmax===Infinity?'ყველა':money(F.pmax);
  const list=apts.filter(matches);$('#count').innerHTML=`შესაბამისი ბინები: <b class="num">${list.length}</b> / ${apts.length}`;
  $('#list').innerHTML=list.slice().sort((a,b)=>b.floor-a.floor||a.k-b.k).slice(0,120).map(a=>
    `<button data-id="${a.id}"><i class="dot" style="background:${STATUS[a.status].c}"></i><b class="num">${a.id}</b><span class="num">${m2(a.area)} · ${a.view==='s'?'ზღვა':'მთა'}</span><span class="p num">${a.price&&a.status!=='s'?money(a.price):'—'}</span></button>`).join('');
  $('#list').querySelectorAll('button').forEach(b=>b.onclick=()=>select(byId[b.dataset.id]));
  if(selected&&!matches(selected))deselect();refreshAll();}
$('#statusBtn').onclick=e=>{statusMode=!statusMode;e.currentTarget.classList.toggle('on',statusMode);e.currentTarget.setAttribute('aria-pressed',statusMode);refreshAll();};
$('#resetBtn').onclick=()=>{deselect();homeView(1.5);};
$('#mfilters').onclick=()=>{document.body.classList.toggle('show-filters');$('#card').hidden=true;};

/* ---------- start: find the ground height under the plot, cut the existing tiles there, build the tower ---------- */
buildTower();applyFilters();homeView(0);
if(tileset){
  const clip=SLAB.map(p=>{const [x,z]=tw(...p);return P(x,0,z);});
  try{tileset.clippingPolygons=new Cesium.ClippingPolygonCollection({polygons:[new Cesium.ClippingPolygon({positions:clip})]});}catch(e){console.warn('clipping not available',e);}
  const ready=()=>{$('#loading').hidden=true;};
  tileset.initialTilesLoaded.addEventListener(async()=>{ready();
    try{const c=[Cesium.Cartographic.fromDegrees(LON+.0004,LAT+.0004),Cesium.Cartographic.fromDegrees(LON-.0004,LAT-.0004),Cesium.Cartographic.fromDegrees(LON+.0004,LAT-.0004)];
      const r=await viewer.scene.sampleHeightMostDetailed(c,ents);const hs=r.map(x=>x.height).filter(h=>isFinite(h)).sort((a,b)=>a-b);
      if(hs.length){ground=hs[0];ENU=Cesium.Transforms.eastNorthUpToFixedFrame(Cesium.Cartesian3.fromDegrees(LON,LAT,ground));buildTower();refreshAll();}}catch(e){console.warn(e);}});
  setTimeout(ready,12000);
}else{$('#loading').hidden=false;}
window.__nao={apts,byId,select,enterView,viewer};
})();
</script>
</body>
